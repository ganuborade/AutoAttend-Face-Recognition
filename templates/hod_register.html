<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOD Registration | AutoAttend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
        }
        .blob-1 {
            width: 400px; height: 400px;
            background: #ff416c;
            top: -100px; left: -100px;
            border-radius: 50%;
        }
        .blob-2 {
            width: 500px; height: 500px;
            background: #ff4b2b;
            bottom: -200px; right: -100px;
            border-radius: 50%;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            z-index: 1;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(0);
            transition: all 0.4s ease;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 2.5rem;
            background: -webkit-linear-gradient(45deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 10px;
        }

        .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
        }

        .form-control:focus {
            background: rgba(15, 23, 42, 0.8);
            color: white;
            border-color: #ff416c;
            box-shadow: 0 0 0 0.25rem rgba(255, 65, 108, 0.25);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7) !important;
        }

        .text-muted {
            color: #cbd5e1 !important;
        }

        .btn-login {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: opacity 0.3s;
        }

        .btn-login:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="login-card">
        <div class="text-center mb-4">
            <i class="fas fa-user-shield fa-3x mb-2" style="color: #ff416c;"></i>
            <div class="brand-logo">AutoAttend</div>
            <p class="text-muted">HOD Account Registration</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} bg-{{ category }} bg-opacity-10 border-{{ category }} text-{{ category }} d-flex align-items-center" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i>
                <div>{{ message }}</div>
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="/hod_register" method="POST">
            <div class="mb-3">
                <label class="form-label text-muted small text-uppercase fw-bold">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 border-secondary"><i class="fas fa-id-card text-muted"></i></span>
                    <input type="text" name="name" class="form-control border-start-0" placeholder="e.g. Dr. Jane Smith" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label text-muted small text-uppercase fw-bold">Mobile Number</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 border-secondary"><i class="fas fa-phone text-muted"></i></span>
                    <input type="text" name="mobile" class="form-control border-start-0" placeholder="e.g. +1 234 567 8900" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label text-muted small text-uppercase fw-bold">Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 border-secondary"><i class="fas fa-map-marker-alt text-muted"></i></span>
                    <input type="text" name="address" class="form-control border-start-0" placeholder="Full Address" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small text-uppercase fw-bold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 border-secondary"><i class="fas fa-envelope text-muted"></i></span>
                    <input type="email" name="email" class="form-control border-start-0" placeholder="e.g. hod@college.edu" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small text-uppercase fw-bold">College Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 border-secondary"><i class="fas fa-university text-muted"></i></span>
                    <input type="text" name="college" class="form-control border-start-0" placeholder="e.g. ABC Engineering College" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small text-uppercase fw-bold">University Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 border-secondary"><i class="fas fa-graduation-cap text-muted"></i></span>
                    <input type="text" name="university" class="form-control border-start-0" placeholder="e.g. State Technical University" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small text-uppercase fw-bold">Sex (Gender)</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 border-secondary"><i class="fas fa-venus-mars text-muted"></i></span>
                    <select name="sex" class="form-select border-start-0 text-white" required>
                        <option value="" disabled selected class="text-dark">Select Gender</option>
                        <option value="Male" class="text-dark">Male</option>
                        <option value="Female" class="text-dark">Female</option>
                        <option value="Other" class="text-dark">Other</option>
                        <option value="Prefer not to say" class="text-dark">Prefer not to say</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small text-uppercase fw-bold">Choose Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 border-secondary"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" name="username" class="form-control border-start-0" placeholder="HOD Username" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small text-uppercase fw-bold">Create Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 border-secondary"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0" placeholder="Strong password" required>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label text-danger small text-uppercase fw-bold">Authorization Unique ID</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 border-danger"><i class="fas fa-key text-danger"></i></span>
                    <input type="password" name="unique_id" class="form-control border-start-0 border-danger" placeholder="Provided by System Admin" required>
                </div>
                <div class="form-text text-muted" style="font-size: 0.75rem;">Required to register as a Head of Department.</div>
            </div>

            <button type="submit" class="btn btn-login w-100 mb-3">CREATE HOD ACCOUNT</button>
            
            <div class="text-center">
                <p class="text-muted small">Already registered? <a href="/hod_login" class="text-danger text-decoration-none fw-bold">Back to Login</a></p>
            </div>
        </form>
    </div>

</body>
</html>
