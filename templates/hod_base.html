<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HOD Dashboard{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #ff416c;
            --secondary-color: #ff4b2b;
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --text-color: #f8fafc;
            --sidebar-width: 260px;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            overflow-x: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 30px;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .sidebar h2 {
            text-align: center;
            font-weight: 800;
            background: -webkit-linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .nav-link {
            color: #cbd5e1;
            padding: 15px 25px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
            border-left: 4px solid transparent;
        }

        .nav-link:hover, .nav-link.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--secondary-color);
            transform: translateX(5px);
        }

        .nav-link i {
            font-size: 1.2rem;
            width: 25px;
            text-align: center;
        }

        /* MAIN CONTENT */
        .main-content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */
        .top-nav {
            height: 70px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-logout {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
            color: white;
        }

        /* CONTENT AREA */
        .content {
            padding: 40px;
            flex: 1;
        }

        /* GLASS CARD */
        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }
        
        .glass-card:hover {
            transform: translateY(-5px);
        }

        .table {
            color: white !important;
            --bs-table-color: white;
            --bs-table-bg: transparent;
            --bs-table-hover-color: #ff416c;
            --bs-table-hover-bg: rgba(255, 255, 255, 0.05);
        }
        
        .table thead th {
            border-bottom: 2px solid rgba(255,255,255,0.1);
            color: var(--secondary-color) !important;
            font-weight: 600;
        }

        .table td {
            border-bottom: 1px solid rgba(255,255,255,0.05);
            vertical-align: middle;
            color: #f8fafc !important;
        }
        
        h1, h2, h3, h4, h5, h6, p, label {
            color: #f8fafc;
        }

        .text-muted {
            color: #cbd5e1 !important;
        }
        
        input::placeholder {
            color: rgba(255, 255, 255, 0.7) !important;
        }

        /* Light Mode Styles */
        body.light-mode {
            --bg-color: #f1f5f9;
            --text-color: #1e293b;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        body.light-mode .sidebar {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.1);
        }
        body.light-mode .nav-link {
            color: #475569;
        }
        body.light-mode .nav-link:hover, body.light-mode .nav-link.active {
            color: var(--primary-color);
            background: rgba(0, 0, 0, 0.05);
        }
        body.light-mode .top-nav {
            background: rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        body.light-mode .glass-card {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }
        body.light-mode .table, body.light-mode h1, body.light-mode h2, body.light-mode h3, body.light-mode p, body.light-mode label, body.light-mode .table td {
            color: #1e293b !important;
        }
        body.light-mode .form-control, body.light-mode .form-select {
            background: #ffffff;
            color: #1e293b;
            border: 1px solid #cbd5e1;
        }
        body.light-mode input::placeholder {
            color: #94a3b8 !important;
        }
        body.light-mode .text-muted {
            color: #64748b !important;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar d-flex flex-column">
        <div>
            <h2>AutoAttend</h2>
            <div class="text-center mb-3 mt-2 px-3">
                <span class="badge bg-danger bg-opacity-25 text-danger border border-danger w-100 py-2" style="font-size: 0.8rem;">
                    <i class="fas fa-user-shield me-1"></i> HOD Portal
                </span>
            </div>
        </div>

        <nav class="nav flex-column mt-3 flex-grow-1">
            <a class="nav-link {% if request.path == '/hod_dashboard' %}active{% endif %}" href="/hod_dashboard">
                <i class="fas fa-users"></i> Teachers Overview
            </a>
            <a class="nav-link {% if request.path == '/hod_profile' %}active{% endif %}" href="/hod_profile">
                <i class="fas fa-user-shield"></i> My Profile
            </a>
            <!-- Could add more HOD specific links here -->
        </nav>
        
        <div class="mt-auto p-3">
            <a href="/hod_logout" class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center">
                <i class="fas fa-sign-out-alt me-2"></i> Logout
            </a>
        </div>
    </div>

    <!-- MAIN WRAPPER -->
    <div class="main-content">
        <!-- TOP NAV -->
        <div class="top-nav">
            <div id="google_translate_element" class="me-3"></div>
            <button id="theme-toggle" class="btn btn-outline-secondary me-3 border-0 text-white theme-btn">
                <i class="fas fa-sun"></i>
            </button>
            <a href="/hod_logout" class="btn btn-logout text-decoration-none">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>

        <!-- PAGE CONTENT -->
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.css"></script>
    
    <!-- Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
          new google.translate.TranslateElement({pageLanguage: 'en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- Theme Toggle Script -->
    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;
        const icon = themeToggle.querySelector('i');
        
        // Initial Check
        if (localStorage.getItem('theme') === 'light') {
            body.classList.add('light-mode');
            icon.classList.remove('fa-sun');
            icon.classList.add('fa-moon');
            themeToggle.classList.replace('text-white', 'text-dark');
        }
        
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            if (body.classList.contains('light-mode')) {
                localStorage.setItem('theme', 'light');
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
                themeToggle.classList.replace('text-white', 'text-dark');
            } else {
                localStorage.setItem('theme', 'dark');
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
                themeToggle.classList.replace('text-dark', 'text-white');
            }
        });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
