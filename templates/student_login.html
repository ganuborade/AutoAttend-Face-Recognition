<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | AutoAttend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
        }
        .blob-1 {
            width: 400px; height: 400px;
            background: #00b09b;
            top: -100px; left: -100px;
            border-radius: 50%;
        }
        .blob-2 {
            width: 500px; height: 500px;
            background: #96c93d;
            bottom: -200px; right: -100px;
            border-radius: 50%;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            z-index: 1;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(0);
            transition: all 0.4s ease;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 2.5rem;
            background: -webkit-linear-gradient(45deg, #00b09b, #96c93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 10px;
        }

        .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
            color: white !important;
            padding: 12px 20px;
            border-radius: 10px;
        }

        .form-control:focus {
            background: rgba(15, 23, 42, 0.8);
            color: white !important;
            border-color: #00b09b;
            box-shadow: 0 0 0 0.25rem rgba(0, 176, 155, 0.25);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7) !important;
        }

        .text-muted {
            color: #cbd5e1 !important;
        }

        .btn-login {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        .btn-login:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="login-card my-5">
        <div class="text-center mb-4">
            <i class="fas fa-user-graduate fa-3x mb-2" style="color: #00b09b;"></i>
            <div class="brand-logo">AutoAttend</div>
            <p class="text-muted">Student Portal Login</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} bg-{{ category }} bg-opacity-10 border-{{ category }} text-{{ category }} d-flex align-items-center" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i>
                <div>{{ message }}</div>
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="/student_login" method="POST">
            <div class="mb-3">
                <label class="form-label text-muted small text-uppercase fw-bold">Roll Number</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 border-secondary"><i class="fas fa-id-badge text-muted"></i></span>
                    <input type="text" name="roll_number" class="form-control border-start-0" placeholder="Enter Roll Number" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-muted small text-uppercase fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 border-secondary"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0" placeholder="Enter Password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-login w-100 mb-3">LOGIN TO DASHBOARD</button>
            
            <div class="text-center">
                <p class="text-muted small mb-1">New Student? <a href="/student_register" class="text-success text-decoration-none fw-bold">Register Here</a></p>
                <p class="text-muted small mb-1"><a href="/forgot_password" class="text-warning text-decoration-none fw-bold">Forgot Password?</a></p>
                <p class="text-muted small"><a href="/" class="text-secondary text-decoration-none">Back to Teacher Portal</a></p>
            </div>
        </form>
    </div>
</body>
</html>
